[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valley-proj"
version = "0.1.0"
description = "HSP-only valley projection and rotation-eigenvalue diagnostics"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "h5py",
  "PyYAML",
  "spglib",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
valley-proj = "valley_proj.cli:main"

[tool.setuptools.packages.find]
include = ["valley_proj*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
