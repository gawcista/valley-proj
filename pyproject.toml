[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valleyscope"
version = "0.1.0"
description = "Valley-resolved wavefunction, subspace, and symmetry diagnostics"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "h5py",
  "PyYAML",
  "spglib",
  "irreptables==3.1.0",
  # irreptables imports irrep.utility. Build this Python 3.10-compatible
  # local revision with scripts/build_irrep_compat_wheel.py (see README).
  "irrep==3.3.0+valleyscope.1",
  "sympy",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
valleyscope = "valleyscope.cli:main"

[tool.setuptools.packages.find]
include = ["valleyscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "dev_docs: local development-document checks (opt in with VALLEYSCOPE_RUN_DEV_DOC_TESTS=1)",
]
