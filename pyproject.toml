[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valleyscope"
version = "0.1.0"
description = "Valley-resolved wavefunction, subspace, and symmetry diagnostics"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "h5py",
  "PyYAML",
  "spglib",
  "irreptables==3.1.0",
  # irreptables imports irrep.utility. Official irrep 3.3 uses Python 3.12
  # f-string syntax; let pip select a compatible public release.
  "irrep>=3.1.1,<3.3; python_version < '3.12'",
  "irrep>=3.1.1,<3.4; python_version >= '3.12'",
  "sympy",
]

[project.optional-dependencies]
test = ["pytest", "setuptools>=68"]
plot = ["matplotlib>=3.6"]

[project.scripts]
valleyscope = "valleyscope.cli:main"

[tool.setuptools.packages.find]
include = ["valleyscope*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "dev_docs: local development-document checks (opt in with VALLEYSCOPE_RUN_DEV_DOC_TESTS=1)",
]
