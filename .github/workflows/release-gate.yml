name: release-gate

on:
  push:
  pull_request:

jobs:
  source-suite:
    name: source suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Minimum, both sides of the dependency-marker boundary, and 3.13.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test extras
        run: python -m pip install -e '.[test]'
      - name: Run portable source suite
        run: python -m pytest -q

  installed-artifact:
    name: installed artifact gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: source-suite
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build frontend
        run: python -m pip install build
      - name: Run installed-artifact release gate
        run: python scripts/release_gate.py --checkout "$GITHUB_WORKSPACE"
