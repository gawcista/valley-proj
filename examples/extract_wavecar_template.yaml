input:
  wavecar: ./WAVECAR

extract:
  # VASP 1-based k-point indices in WAVECAR.
  kpoints:
    - name: GammaM
      vasp_index: 1
    - name: KM
      vasp_index: 2

  # VASP 1-based band indices to copy into selected_wavefunctions.h5.
  # Also accepts {start: 101, end: 120}, "101-120", or mixed lists.
  bands_vasp: [101, 102]

  # For collinear ISPIN=2 WAVECAR files, extract one spin channel at a time.
  # Noncollinear/SOC spinor records are detected from coefficient record length.
  spin_index: 1

  # Maximum allowed |delta_Ecut| in eV for automatic G-list reconstruction
  # cutoff adjustment (default 0.0 = strict exact-match only).
  # Start from 0.005 eV or 0.01 eV.  Values near 0.05 eV or larger are
  # suspicious -- check WAVECAR variant, lattice convention, G-list ordering,
  # and k-point convention before raising the tolerance.
  # ecut_adjust_tol does NOT modify the DFT ENCUT; it only adjusts the
  # post-processing G-list reconstruction effective cutoff tolerance.
  # ecut_adjust_tol: 0.0

output:
  wavefunction_h5: ./selected_wavefunctions.h5
