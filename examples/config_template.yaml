input:
  wavefunction_h5: ./selected_wavefunctions.h5
  monolayer_poscars:
    top: ./monolayer.vasp
    bottom: ./monolayer.vasp

layer_transforms:
  top:
    # For a twist_generator-style commensurate cell, use the integer matrix P
    # satisfying M_moire = P^T A_layer in row-vector lattice convention.
    supercell_matrix:
      - [9, -5, 0]
      - [5, 4, 0]
      - [0, 0, 1]
  bottom:
    supercell_matrix:
      - [9, -4, 0]
      - [4, 5, 0]
      - [0, 0, 1]

analysis:
  kpoints: [GammaM, KM, MM]
  iband: [101, 102]
  subspace_energy_tol_meV: 1.0

valley_centers:
  coordinate_mode: layer_frac
  centers:
    - name: top_K
      layer: top
      frac: [0.333333333333, 0.333333333333, 0.0]
    - name: bottom_K
      layer: bottom
      frac: [0.333333333333, 0.333333333333, 0.0]
    - name: top_Kp
      layer: top
      frac: [-0.333333333333, -0.333333333333, 0.0]
    - name: bottom_Kp
      layer: bottom
      frac: [-0.333333333333, -0.333333333333, 0.0]

valley_subspaces:
  - name: K_valley
    centers: [top_K, bottom_K]
  - name: Kp_valley
    centers: [top_Kp, bottom_Kp]

projection:
  qcut_fraction: 0.20
  qcut_scan: [0.15, 0.20, 0.25, 0.30]
  thresholds:
    W_val_min: 0.8
    valley_concentration_clean: 0.95
    valley_concentration_approx: 0.85
    # Legacy aliases (still accepted): P_v_clean, P_v_approx

symmetry:
  operations:
    structure_file: ./CONTCAR
  tolerance:
    symprec: 1.0e-3
    angle_tolerance: -1.0
    symprec_scan: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3]
  filters:
    # Legacy summary/highlight field for the cyclic rotation order.
    # V1.1 does NOT use this to select which operations enter symmetry analysis;
    # all proper little-group operations (order 2,3,4,6) are enumerated and
    # filtered by per-valley stabilizer.  Accepted values: auto, integer n, none.
    rotation_order: auto

rotation:
  # strict keeps the conservative defaults; normal/loose are numerical readiness presets.
  readiness_preset: strict
  unitarity_tol: 1.0e-4
  root_deviation_tol: 1.0e-6
  D_valley_offdiag_tol: 1.0e-6
  irrep_weight_tol: 1.0e-5

output:
  directory: ./valley_analysis
