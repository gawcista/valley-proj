input:
  wavefunction_h5: ./selected_wavefunctions.h5
  monolayer_poscars:
    top: ./monolayer.vasp
    bottom: ./monolayer.vasp

layer_transforms:
  top:
    # For a twist_generator-style commensurate cell, use the integer matrix P
    # satisfying M_moire = P^T A_layer in row-vector lattice convention.
    supercell_matrix:
      - [9, -5, 0]
      - [5, 4, 0]
      - [0, 0, 1]
  bottom:
    supercell_matrix:
      - [9, -4, 0]
      - [4, 5, 0]
      - [0, 0, 1]

analysis:
  kpoints: [GammaM, KM, MM]
  target_bands_vasp: [101, 102]
  degeneracy_tol_meV: 1.0

valley_centers:
  coordinate_mode: layer_frac
  centers:
    - name: top_K
      layer: top
      frac: [0.333333333333, 0.333333333333, 0.0]
    - name: bottom_K
      layer: bottom
      frac: [0.333333333333, 0.333333333333, 0.0]
    - name: top_Kp
      layer: top
      frac: [-0.333333333333, -0.333333333333, 0.0]
    - name: bottom_Kp
      layer: bottom
      frac: [-0.333333333333, -0.333333333333, 0.0]

valley_sectors:
  - name: K_sector
    centers: [top_K, bottom_K]
  - name: Kp_sector
    centers: [top_Kp, bottom_Kp]

projection:
  use_2d_momentum_only: true
  qcut_mode: relative_min_sector_distance
  qcut_fraction: 0.30
  qcut_scan: [0.20, 0.25, 0.30, 0.35, 0.40]
  overlap_cross_sector: warn_exclude
  thresholds:
    W_val_min: 0.8
    P_v_clean: 0.95
    P_v_approx: 0.85

symmetry:
  operations:
    mode: auto
    structure_file: ./CONTCAR
    backend: spglib
  tolerance:
    symprec: 1.0e-3
    angle_tolerance: -1.0
    symprec_scan: [1.0e-5, 3.0e-5, 1.0e-4, 3.0e-4, 1.0e-3]
  filters:
    proper_rotations_only: true
    allowed_orders: [2, 3, 4, 6]

output:
  directory: ./valley_analysis
  summary_stdout: true
  write_summary_txt: true
  write_summary_json: true
  write_detailed_files: true
  write_json: true
  write_csv: true
  write_hdf5_basis_transform: true
